version: 2
updates:
  # Mantém as dependências declaradas no pom.xml atualizadas.
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Mantém as versões das actions usadas em .github/workflows atualizadas.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
